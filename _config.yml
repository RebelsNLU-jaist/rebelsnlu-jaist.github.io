title: RebelsNLU
description: Reading Between the Lines NLU (RebelsNLU) team at JAIST
author: Naoya Inoue
lang: en
direction: ltr
url: https://rebelsnlu-jaist.github.io
baseurl: ""

remote_theme: chrisrhymes/bulma-clean-theme@v0.13.1
fixed_navbar: top
hide_footer: true

paginate: 10
paginate_path: "/news/page:num/"

# Superseded page versions kept for reference; not published.
# Listing `exclude` overrides Jekyll's defaults, so those are repeated here.
exclude:
  - history/
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-redirect-from
  - kramdown-parser-gfm

defaults:
  - scope:
      path: ""
      type: pages
    values:
      hero_image: /imgs/hero-sep.jpg
      hero_height: is-fullwidth
  - scope:
      path: ""
      type: posts
    values:
      hero_height: is-fullwidth
      image: /imgs/posts/new.png
