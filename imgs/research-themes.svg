<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Research themes: Interpretability, Safety, Reasoning">
  <title>Research Themes</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071229"/>
      <stop offset="52%" stop-color="#0b1e4d"/>
      <stop offset="100%" stop-color="#13315c"/>
    </linearGradient>

    <radialGradient id="glow" cx="82%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#e9c15a" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#e9c15a" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>

    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="340" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="16" fill="none" stroke="#ffffff" stroke-opacity=".10"/>

  <!-- column dividers -->
  <line x1="400" y1="42" x2="400" y2="300" stroke="#ffffff" stroke-opacity=".10"/>
  <line x1="800" y1="42" x2="800" y2="300" stroke="#ffffff" stroke-opacity=".10"/>

  <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Noto Sans JP', sans-serif">

    <!-- ================= COLUMN 1 — Interpretability ================= -->
    <g transform="translate(44,0)">
      <!-- magnifier icon -->
      <g stroke="#e9c15a" stroke-width="2.4" fill="none" stroke-linecap="round">
        <circle cx="12" cy="46" r="9"/>
        <line x1="18.5" y1="52.5" x2="25" y2="59"/>
      </g>
      <text x="40" y="56" font-size="27" font-weight="800" fill="#ffffff" letter-spacing="-.3">Interpretability</text>
      <rect x="0" y="70" width="44" height="3" rx="1.5" fill="#e9c15a"/>
      <text x="0" y="99" font-size="14.5" font-weight="600" fill="#e9c15a">How does AI intelligence work?</text>

      <text x="0" y="134" font-size="15" fill="#dbe4f7">Understanding the mechanisms of in-context</text>
      <text x="0" y="155" font-size="15" fill="#dbe4f7">learning</text>
      <text x="0" y="175" font-size="12.5" font-style="italic" fill="#8fa2c6">(Cho+ ICLR'25; ICLR'26)</text>

      <text x="0" y="213" font-size="15" fill="#dbe4f7">Internal analysis of multilingual LLMs</text>
      <text x="0" y="233" font-size="12.5" font-style="italic" fill="#8fa2c6">(Tezuka+ EMNLP'25)</text>

      <text x="0" y="271" font-size="15" fill="#dbe4f7">Understanding compositional reasoning in VLMs</text>
      <text x="0" y="291" font-size="12.5" font-style="italic" fill="#8fa2c6">(Shi+ EACL'26)</text>
    </g>

    <!-- ================= COLUMN 2 — Safety ================= -->
    <g transform="translate(444,0)">
      <!-- shield icon -->
      <g stroke="#e9c15a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 37 L23 41.5 V50 C23 56.5 18.4 61.6 12 63.5 C5.6 61.6 1 56.5 1 50 V41.5 Z"/>
        <path d="M7.5 49.5 L10.8 53 L16.5 46.5"/>
      </g>
      <text x="40" y="56" font-size="27" font-weight="800" fill="#ffffff" letter-spacing="-.3">Safety</text>
      <rect x="0" y="70" width="44" height="3" rx="1.5" fill="#e9c15a"/>
      <text x="0" y="99" font-size="14.5" font-weight="600" fill="#e9c15a">How can we use AI safety?</text>

      <text x="0" y="134" font-size="15" fill="#dbe4f7">Removing harmful knowledge from LLMs</text>
      <text x="0" y="154" font-size="12.5" font-style="italic" fill="#8fa2c6">(Dang+ AAAI'25; TMLR'26)</text>

      <text x="0" y="192" font-size="15" fill="#dbe4f7">Refining LLM self-evaluation</text>
      <text x="0" y="212" font-size="12.5" font-style="italic" fill="#8fa2c6">(Ishii+ AACL'25)</text>

      <text x="0" y="250" font-size="15" fill="#dbe4f7">Understanding the mechanisms of metacognition</text>
      <text x="0" y="270" font-size="12.5" font-style="italic" fill="#8fa2c6">(Sato+ NLP'26)</text>
    </g>

    <!-- ================= COLUMN 3 — Reasoning ================= -->
    <g transform="translate(844,0)">
      <!-- node-graph icon -->
      <g stroke="#e9c15a" stroke-width="2.4" fill="none" stroke-linecap="round">
        <line x1="12" y1="44" x2="4" y2="57"/>
        <line x1="12" y1="44" x2="20" y2="57"/>
        <circle cx="12" cy="40" r="4.2"/>
        <circle cx="3" cy="60" r="4.2"/>
        <circle cx="21" cy="60" r="4.2"/>
      </g>
      <text x="40" y="56" font-size="27" font-weight="800" fill="#ffffff" letter-spacing="-.3">Reasoning</text>
      <rect x="0" y="70" width="44" height="3" rx="1.5" fill="#e9c15a"/>
      <text x="0" y="99" font-size="14.5" font-weight="600" fill="#e9c15a">How can we enhance AI's reasoning?</text>

      <text x="0" y="134" font-size="15" fill="#dbe4f7">Strengthening comprehension of logical fallacies</text>
      <text x="0" y="154" font-size="12.5" font-style="italic" fill="#8fa2c6">(Robbani+ EMNLP'24)</text>

      <text x="0" y="192" font-size="15" fill="#dbe4f7">Socratic question generation</text>
      <text x="0" y="212" font-size="12.5" font-style="italic" fill="#8fa2c6">(Pothong+ AACL'25)</text>

      <text x="0" y="250" font-size="15" fill="#dbe4f7">Enhancing logical reasoning via attention</text>
      <text x="0" y="271" font-size="15" fill="#dbe4f7">mechanisms</text>
      <text x="0" y="291" font-size="12.5" font-style="italic" fill="#8fa2c6">(Nguyen+ EACL'26)</text>
    </g>

  </g>
</svg>
