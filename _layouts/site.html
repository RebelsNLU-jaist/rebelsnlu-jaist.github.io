<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.browser_title %}{{ page.browser_title }}{% elsif page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site-common.css' | relative_url }}">
    <link rel="stylesheet" href="{{ page.stylesheet | relative_url }}">
    {% seo %}
  </head>
  <body class="page-{{ page.page_id }}">
    {% include site-nav.html %}
    {% if page.hero %}{% include page-hero.html %}{% endif %}
    {{ content }}
    {% include site-footer.html %}
    {% if page.script %}<script src="{{ page.script | relative_url }}"></script>{% endif %}
  </body>
</html>
