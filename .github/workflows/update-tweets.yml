name: Update X posts

# Refreshes assets/data/tweets.json from the @rebelsnlu_jaist public timeline so
# the homepage's "X / Twitter timeline" card stays in sync. Runs on a schedule
# and can be triggered by hand from the Actions tab.

on:
  schedule:
    - cron: "0 */3 * * *" # every 3 hours (UTC); tune as you like
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tweets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch featured posts
        run: python .github/scripts/fetch_tweets.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain assets/data/tweets.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/data/tweets.json
            git commit -m "chore: refresh X posts [skip ci]"
            git push
          else
            echo "No changes to tweets.json."
          fi
